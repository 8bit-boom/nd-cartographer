# nd-cartographer on a home server (TrueNAS SCALE, Unraid, plain Docker).
# Full steps: docs/DOCKER.md
services:
  ndcart:
    image: ghcr.io/8bit-boom/nd-cartographer:latest
    # build: .            # or build it yourself from this repository
    container_name: nd-cartographer
    restart: unless-stopped
    ports:
      - "8300:8300"
    # 568 is the "apps" user on TrueNAS SCALE; use the owner of your dataset.
    user: "568:568"
    environment:
      # The server is not on loopback, so it asks for an access token. Set a
      # long random string, or remove this line to have one generated, stored
      # in /data/token and printed once in the logs.
      ND_CARTO_TOKEN: "change-me-to-a-long-random-string"
      # Optional: link to nd-world for publish / entities / AI.
      # ND_CARTO_SERVER: "http://nd-world:8000"
      # ND_CARTO_EMAIL: "gm@example.com"
      # ND_CARTO_PASSWORD_FILE: "/run/secrets/nd_password"
      # Optional: a standalone OpenAI-compatible model instead of nd-world.
      # ND_CARTO_LLM_URL: "http://ollama:11434/v1"
      # ND_CARTO_LLM_MODEL: "llama3.1"
      # Optional: the local model below (the `ai-cpu` or `ai-gpu` profile). Use `llm-gpu`
      # in the address for the GPU profile. The key file is made by `ndcart ai key` (see
      # docs/DOCKER.md); it is read from the file, never written in this YAML.
      # ND_CARTO_LLM_URL: "http://llm:8080/v1"
      # ND_CARTO_LLM_MODEL: "ndcart-local"
      # ND_CARTO_LLM_KEY_FILE: "/data/ai-runtime.key"
    volumes:
      - ./data:/data

  # ---- optional local AI (nothing here runs unless you pick a profile) -------------------
  # `docker compose --profile ai-cpu up -d`   a model on the CPU
  # `docker compose --profile ai-gpu up -d`   a model on an NVIDIA GPU
  # First download the model with the studio image (it checks the file's SHA-256):
  #   docker compose run --rm ndcart ndcart ai pull qwen3.5-4b --data-dir /data --yes
  #   docker compose run --rm ndcart ndcart ai key --data-dir /data
  # The model path below is the catalog's file name; if `ai pull` printed a different
  # path, use that one. Pin the image to a tag you have tested (":server" moves).
  llm:
    profiles: ["ai-cpu"]
    image: ghcr.io/ggml-org/llama.cpp:server
    container_name: nd-cartographer-llm
    restart: unless-stopped
    command:
      - "-m"
      - "/data/models/unsloth/Qwen3.5-4B-GGUF/Qwen3.5-4B-UD-Q4_K_XL.gguf"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8080"
      - "--alias"
      - "ndcart-local"
      - "--api-key-file"
      - "/data/ai-runtime.key"
      - "-c"
      - "16384"
      - "-np"
      - "1"
      - "--no-webui"
    # Read-only: the server needs the model and the key, nothing else. No port is published;
    # only the studio (on this compose network) reaches it.
    volumes:
      - ./data:/data:ro

  llm-gpu:
    profiles: ["ai-gpu"]
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    container_name: nd-cartographer-llm-gpu
    restart: unless-stopped
    command:
      - "-m"
      - "/data/models/unsloth/Qwen3.5-4B-GGUF/Qwen3.5-4B-UD-Q4_K_XL.gguf"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8080"
      - "--alias"
      - "ndcart-local"
      - "--api-key-file"
      - "/data/ai-runtime.key"
      - "-c"
      - "16384"
      - "-np"
      - "1"
      - "--no-webui"
      - "-ngl"
      - "all"
    volumes:
      - ./data:/data:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
