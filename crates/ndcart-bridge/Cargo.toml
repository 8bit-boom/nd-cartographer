[package]
name = "ndcart-bridge"
description = "The optional nd-world client for nd-cartographer: login, capability probe, publish"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
ndcart-core = { path = "../ndcart-core" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "cookies", "json", "multipart"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
wiremock = "0.6"
