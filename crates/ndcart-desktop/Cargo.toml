[package]
name = "ndcart-desktop"
description = "The nd-cartographer desktop shell (Tauri v2): a native window over the same ndcart server"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true

# The shell never builds for musl (the Docker image serves the browser
# studio), and gating the dependencies keeps tauri out of the Docker
# dependency layer entirely. Not a default workspace member either: plain
# `cargo test`/clippy in CI stays on the server crates, which need no
# platform webview dev packages.
[target.'cfg(not(target_env = "musl"))'.build-dependencies]
tauri-build = { version = "2", features = [] }

[target.'cfg(not(target_env = "musl"))'.dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde_json = "1"
