# The local-model catalog for `ndcart ai models | pull | setup` (plan item 4.1).
#
# This file is NOT part of the instruction pack. It describes GGUF files the studio may
# download from the Hugging Face Hub, after the user confirms the size.
#
# Honesty rules, enforced by tests:
#   - `verified = false` on every entry until `ndcart ai test` has passed for it. A pass is
#     recorded per machine in <data>/ai-verified.json, never in this file, so nothing here is
#     ever shown as "tested" on the strength of the catalog alone.
#   - `listing_checked` is the date the repo and file name were last seen on the Hub (empty:
#     never). Names below were written from documentation and third-party tables and could not
#     be fetched when the catalog was written (the Hub was unreachable), so they are
#     unchecked. `ndcart ai pull` reads the live file list and size, and if `file` is not
#     there it picks the one .gguf whose name contains `quant`, or lists the candidates.
#   - `approx_bytes` is for choosing a model that fits; the real size, and the SHA-256, come
#     from the Hub at download time. No checksum is stored here. A pinned `sha256` is optional
#     and wins when present.
#   - `kv_kib_per_token` is a rough allowance for the context memory (a heuristic).
#
# Tiers: cpu8 (about 8 GB of RAM, no GPU), vram12 (12-16 GB of VRAM), vram24 (24 GB or more of
# VRAM), apple16 (Apple Silicon with 16 GB), apple32 (Apple Silicon with 32 GB or more).
# A model in tier T fits machines of tier T and above.

version = 1

[[model]]
id = "qwen3.5-4b"
label = "Qwen3.5 4B (small, fast, good first choice)"
tier = "cpu8"
hf_repo = "unsloth/Qwen3.5-4B-GGUF"
file = "Qwen3.5-4B-UD-Q4_K_XL.gguf"
quant = "UD-Q4_K_XL"
approx_bytes = 3000000000
ctx_default = 16384
ctx_native = 262144
kv_kib_per_token = 48
license = "apache-2.0"
notes = "Strong instruction following for its size. Thinking is off by default, which suits JSON."
verified = false
listing_checked = ""

