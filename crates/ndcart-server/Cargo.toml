[package]
name = "ndcart-server"
description = "The nd-cartographer server binary (ndcart): serve, tiles, doc API, bench"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "ndcart"
path = "src/main.rs"

[features]
default = ["bridge"]
# The optional nd-world client. CI also runs with --no-default-features so
# the studio stays fully usable without it (plan §9.4 standalone parity).
bridge = ["dep:ndcart-bridge"]

[dependencies]
ndcart-core = { path = "../ndcart-core" }
ndcart-formats = { path = "../ndcart-formats" }
ndcart-paint = { path = "../ndcart-paint" }
ndcart-terrain = { path = "../ndcart-terrain" }
ndcart-bridge = { path = "../ndcart-bridge", optional = true }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json", "query"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "fs", "io-util", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tiny-skia = "0.11"
# Pack manifest v2 (plan 22.1): reading and writing ndpack.toml.
toml = "0.8"
zip = { version = "2", default-features = false, features = ["deflate"] }
futures-core = "0.3"
futures-util = "0.3"
ab_glyph = "0.2"
image = { version = "0.25", default-features = false, features = ["webp", "avif", "png", "jpeg", "gif", "bmp"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
