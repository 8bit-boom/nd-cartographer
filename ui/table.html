<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<base href="__ND_BASE__">
<title>Table view</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #000; color: #9aa4b2; font-family: system-ui, sans-serif; }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  #map { max-width: 100vw; max-height: 100vh; object-fit: contain; image-rendering: auto; display: none; }
  #msg { font-size: 1.4rem; text-align: center; padding: 2rem; }
  #fs { position: fixed; top: 10px; right: 10px; width: 40px; height: 40px; border-radius: 8px;
        border: 1px solid #333; background: rgba(20,22,26,.6); color: #9aa4b2; font-size: 18px;
        cursor: pointer; opacity: .5; }
  #fs:hover { opacity: 1; }
</style>
</head>
<body>
<div id="wrap">
  <img id="map" alt="The map as the players see it">
  <div id="msg" role="status">Waiting for the GM…</div>
</div>
<button id="fs" type="button" title="Fullscreen" aria-label="Toggle fullscreen">⛶</button>
<script>
'use strict';
// Base-path support (served behind nd-world's /cartographer/studio proxy):
// prefix absolute API URLs with the <base> prefix. No-op at the root.
const ND_BASE = (() => { const b = document.querySelector('base'); const h = b ? (b.getAttribute('href') || '/') : '/'; return h.replace(/\/+$/, ''); })();
if (ND_BASE) {
  const ndAbs = (u) => (typeof u === 'string' && u.startsWith('/') && !u.startsWith('//')) ? ND_BASE + u : u;
  const _fetch = window.fetch;
  window.fetch = (input, init) => _fetch(typeof input === 'string' ? ndAbs(input) : input, init);
  const _src = Object.getOwnPropertyDescriptor(HTMLImageElement.prototype, 'src');
  Object.defineProperty(HTMLImageElement.prototype, 'src', { configurable: true, get() { return _src.get.call(this); }, set(v) { _src.set.call(this, ndAbs(v)); } });
}
const DOC = '__DOC__';
const img = document.getElementById('map');
const msg = document.getElementById('msg');
let shown = '';
let lastState = null;
const CAN_POST = new URLSearchParams(location.search).has('token');

// Tablet companion (plan 21.15): with the token in the URL, tapping the map
// moves the viewer spot there - tap-to-reveal on a second device. The tap
// offset from the picture's centre converts to cells via the displayed
// pixels-per-cell (object-fit: contain maths on the real drawn box).
img.addEventListener('click', async (e) => {
  if (!CAN_POST || !lastState || !img.naturalWidth) return;
  const r = img.getBoundingClientRect();
  // The drawn (contain-fitted) box inside the element:
  const scale = Math.min(r.width / img.naturalWidth, r.height / img.naturalHeight);
  const drawW = img.naturalWidth * scale, drawH = img.naturalHeight * scale;
  const cx = r.left + (r.width - drawW) / 2 + drawW / 2;
  const cy = r.top + (r.height - drawH) / 2 + drawH / 2;
  const span = 2 * lastState.radius + 1;                 // cells across the picture
  const cellPx = Math.max(drawW / span, drawH / span);   // whichever axis fits
  const dxCells = (e.clientX - cx) / cellPx;
  const dyCells = (e.clientY - cy) / cellPx;
  try {
    await fetch(`/api/docs/${DOC}/table`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        floor: lastState.floor,
        x: +(lastState.x + dxCells).toFixed(2),
        y: +(lastState.y + dyCells).toFixed(2),
        radius: lastState.radius,
        darkness: lastState.darkness,
      }),
    });
  } catch { /* the tick loop reports connection trouble */ }
});

// Size the preview to the display so it is sharp on a 4K TV (a fixed ppc=24 was
// soft). The picture spans 2*radius+1 cells; fill the larger screen dimension,
// capped at the server's preview limit (64 px/cell).
function ppcFor(st) {
  const span = 2 * st.radius + 1;
  const dim = Math.max(screen.width, screen.height) * (window.devicePixelRatio || 1);
  return Math.max(8, Math.min(64, Math.round(dim / span)));
}
function urlFor(st, frame) {
  const q = new URLSearchParams({ floor: st.floor, x: st.x, y: st.y, radius: st.radius, darkness: st.darkness, ppc: ppcFor(st), frame });
  return `/api/docs/${DOC}/preview?${q}`;
}
// Three drifting water frames cycle while the spot stands still (plan 21.10).
const FRAMES = [0, 1, 2];
let frameIdx = 0;
let delay = 1500;

async function tick() {
  try {
    const res = await fetch(`/api/docs/${DOC}/table`, { cache: 'no-store' });
    if (!res.ok) throw new Error(String(res.status));
    const t = await res.json();
    img.style.opacity = '';
    lastState = t.on ? t.state : null;
    document.title = t.name ? `${t.name} - table view` : 'Table view';
    if (!t.on) {
      img.style.display = 'none'; msg.style.display = ''; msg.textContent = 'Waiting for the GM…'; shown = '';
    } else {
      // A new picture only when the GM moved, or the map changed (a door opened, a light lit).
      const key = `${t.state.n}/${t.rev}`;
      if (key !== shown) {
        const next = new Image();
        next.onload = () => { img.src = next.src; img.style.display = 'block'; msg.style.display = 'none'; shown = key; };
        next.src = urlFor(t.state, FRAMES[0]) + `&rev=${t.rev}`;
      } else if (lastState && !document.hidden) {
        // Same spot: cycle the water frames (paused while the tab is hidden).
        frameIdx = (frameIdx + 1) % FRAMES.length;
        const next = new Image();
        next.onload = () => { img.src = next.src; };
        next.src = urlFor(t.state, FRAMES[frameIdx]) + `&rev=${t.rev}`;
      }
    }
    delay = 1500;   // healthy: back to the normal cadence
  } catch {
    msg.style.display = ''; msg.textContent = 'Lost touch with the studio; trying again…';
    img.style.opacity = '0.35';   // dim the stale picture so it is not mistaken for live
    delay = Math.min(delay * 2, 15000);   // back off while the server is away
  }
  setTimeout(tick, delay);
}
tick();

// Fullscreen for a TV, and keep the screen awake on a tablet where supported.
document.getElementById('fs').onclick = () => {
  if (document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen().catch(() => {});
};
async function keepAwake() {
  try { if ('wakeLock' in navigator) await navigator.wakeLock.request('screen'); } catch { /* not allowed */ }
}
keepAwake();
document.addEventListener('visibilitychange', () => { if (!document.hidden) keepAwake(); });
</script>
</body>
</html>
