<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>nd-cartographer</title>
<link rel="stylesheet" href="/app.css">
</head>
<body>
<header id="topbar">
  <strong id="doc-name">nd-cartographer</strong>
  <select id="doc-select" title="Switch project" aria-label="Project"></select>
  <button id="btn-new" title="New project">＋ New</button>
  <button id="btn-open" title="Open a Universal VTT file (.dd2vtt / .uvtt) as a project">📂 Open .dd2vtt…</button>
  <input type="file" id="file-open" accept=".dd2vtt,.uvtt,.df2vtt,application/json" hidden>
  <span id="doc-meta" class="dim"></span>
  <span class="spacer"></span>
  <div class="tools">
    <button id="tool-pan" class="tool active" title="Pan (drag / middle mouse)">✋ Pan</button>
    <button id="tool-paint" class="tool" title="Paint cells (drag)">🖌 Paint</button>
    <button id="tool-brush" class="tool" title="Brush: freehand material (R). Pen pressure and tilt shape the line">🖍 Brush</button>
    <button id="tool-erase" class="tool" title="Eraser: reveals the room layer beneath (E)">🧽 Erase</button>
    <button id="tool-stamp" class="tool" title="Stamp: place a prop (S). , and . rotate, F flips">📦 Stamp</button>
    <button id="tool-door" class="tool" title="Door on a cell edge (click an edge again to remove)">🚪 Door</button>
    <button id="tool-window" class="tool" title="Window on a cell edge">🪟 Window</button>
    <span id="palette"></span>
    <button id="btn-undo" title="Undo (Ctrl+Z)">↩ Undo</button>
    <button id="btn-outline" title="Outline (O)">☰ Outline</button>
    <button id="btn-problems" title="Problems (P)">⚠ Problems</button>
    <span id="exports" class="dim">
      <label title="Secret doors become plain walls, GM-only notes are dropped"><input type="checkbox" id="exp-player"> players' copy</label>
      Export:
      <a id="exp-png" download>PNG</a>
      <a id="exp-webp" download>WebP</a>
      <a id="exp-avif" download>AVIF</a>
      <a id="exp-uvtt" download>UVTT</a>
    </span>
    <button id="btn-help" title="Keyboard help (F1)">?</button>
  </div>
</header>
<main>
  <nav id="outliner" aria-label="Map outline">
    <h3>Outline</h3>
    <ul id="tree" role="tree" aria-label="Rooms, lights and notes"></ul>
    <p class="dim hint">↑↓ move · ←→ fold · Enter go to · F2 rename · Del remove</p>
  </nav>
  <div id="stage"><canvas id="canvas"></canvas>
  <div id="brushbar" hidden>
    <label>Brush <select id="br-kind"><option value="round">Round</option><option value="scatter">Scatter</option></select></label>
    <label>Size <input type="range" id="br-size" min="0.2" max="10" step="0.1" value="2"><output id="br-size-o">2</output></label>
    <label>Opacity <input type="range" id="br-opacity" min="0.05" max="1" step="0.05" value="1"></label>
    <label>Hardness <input type="range" id="br-hardness" min="0" max="1" step="0.05" value="0.8"></label>
    <label>Rough edge <input type="range" id="br-rough" min="0" max="1" step="0.05" value="0.2"></label>
    <label>Density <input type="range" id="br-density" min="0.05" max="1" step="0.05" value="0.6"></label>
    <span class="dim">[ ] size</span>
  </div>
  <div id="stampbar" hidden>
    <span id="stamp-palette"></span>
    <label>Scale <input type="range" id="st-scale" min="0.3" max="3" step="0.1" value="1"></label>
    <label>Rotate <input type="range" id="st-rot" min="0" max="345" step="15" value="0"><output id="st-rot-o">0°</output></label>
    <label><input type="checkbox" id="st-flip"> flip</label>
    <label><input type="checkbox" id="st-shadow" checked> shadow</label>
    <label><input type="checkbox" id="st-snap" checked> snap ½ cell</label>
    <span class="dim">, . rotate · F flip</span>
  </div>
  <aside id="problems" hidden>
    <h3>Problems <button id="problems-close" title="Close">×</button></h3>
    <ul id="problem-list"></ul>
  </aside>
  <div id="help" hidden>
    <h3>Keyboard</h3>
    <table id="help-table"></table>
    <p class="dim">Press F1 or Esc to close.</p>
  </div>
  <div id="status" class="dim">loading…</div>
  </div>
</main>
<script src="/app.js"></script>
</body>
</html>
