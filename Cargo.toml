[workspace]
resolver = "2"
members = ["crates/ndcart-core", "crates/ndcart-bridge", "crates/ndcart-formats", "crates/ndcart-paint", "crates/ndcart-terrain", "crates/ndcart-server", "crates/ndcart-desktop"]
# The desktop shell needs the platform webview dev packages on Linux, so the
# default commands (test, clippy, the Docker build) stay on the server crates.
default-members = ["crates/ndcart-core", "crates/ndcart-bridge", "crates/ndcart-formats", "crates/ndcart-paint", "crates/ndcart-terrain", "crates/ndcart-server"]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"
repository = "https://github.com/8bit-boom/nd-cartographer"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
