name: tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --check
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: tests
        run: cargo test --locked
      - name: bench smoke
        run: cargo run -q -p ndcart-server --bin ndcart bench

  docker:
    needs: rust
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/nd-cartographer:latest
            ghcr.io/${{ github.repository_owner }}/nd-cartographer:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: smoke
        run: |
          docker run -d --name ndcart -p 8300:8300 \
            ghcr.io/${{ github.repository_owner }}/nd-cartographer:${{ github.sha }}
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:8300/health && break || sleep 1
          done
          curl -sf http://127.0.0.1:8300/health | grep -o '"status":"ok"'
          docker rm -f ndcart >/dev/null
