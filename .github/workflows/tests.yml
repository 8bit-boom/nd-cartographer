name: tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --check
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: tests
        run: cargo test --locked
      - name: bench smoke
        run: cargo run -q -p ndcart-server --bin ndcart bench
      - name: standalone parity (bridge feature off)
        run: cargo test --locked -p ndcart-server --no-default-features

  desktop:
    # The Tauri shell is not a default workspace member (Linux needs the
    # webview dev packages); this job is its compile gate.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/ndcart-desktop
      - name: webview dev packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - name: check the shell compiles
        run: cargo check --locked -p ndcart-desktop

# The image build/smoke/publish lives in docker.yml (it carries the
# packages:write permission this workflow cannot grant).
