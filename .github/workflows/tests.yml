name: tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --check
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: tests
        run: cargo test --locked
      - name: bench gate (release, the plan's 32 px/cell budget)
        run: cargo run --release -q -p ndcart-server --bin ndcart bench --ppc 32
      - name: standalone parity (bridge feature off)
        run: cargo test --locked -p ndcart-server --no-default-features

  ui:
    # The browser UI is vanilla JS embedded in the binary; these gates catch the
    # syntax/runtime errors that a Rust-only CI cannot see (v0.1.0 shipped with
    # string syntax errors that broke the whole UI script).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: JS syntax gate
        run: node --check ui/app.js
      - name: Install UI dev deps
        run: npm ci --no-audit --no-fund
      - name: ESLint
        run: npm run lint
      - name: Build the server for the smoke test
        run: cargo build --locked -p ndcart-server --bin ndcart
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: End-to-end smoke
        run: npm run test:e2e

  supply-chain:
    # Plan §17.7: license + advisory scanning over the dependency tree.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo-deny (licenses, advisories, bans, sources)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
      - name: cargo-audit (RustSec advisories)
        run: |
          cargo install cargo-audit --locked
          cargo audit

  desktop:
    # The Tauri shell is not a default workspace member (Linux needs the
    # webview dev packages); this job is its compile gate.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/ndcart-desktop
      - name: webview dev packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - name: stage a placeholder sidecar (tauri-build validates its presence)
        shell: bash
        run: |
          cargo build -q -p ndcart-server --bin ndcart
          mkdir -p crates/ndcart-desktop/binaries
          exe=ndcart; [ "${{ runner.os }}" = "Windows" ] && exe=ndcart.exe
          triple=x86_64-unknown-linux-gnu; [ "${{ runner.os }}" = "Windows" ] && triple=x86_64-pc-windows-msvc
          cp "target/debug/$exe" "crates/ndcart-desktop/binaries/ndcart-$triple${{ runner.os == 'Windows' && '.exe' || '' }}"
      - name: check the shell compiles
        run: cargo check --locked -p ndcart-desktop

# The image build/smoke/publish lives in docker.yml (it carries the
# packages:write permission this workflow cannot grant).
