name: tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --check
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: tests
        run: cargo test --locked
      - name: bench smoke
        run: cargo run -q -p ndcart-server --bin ndcart bench
      - name: standalone parity (bridge feature off)
        run: cargo test --locked -p ndcart-server --no-default-features

# The image build/smoke/publish lives in docker.yml (it carries the
# packages:write permission this workflow cannot grant).
