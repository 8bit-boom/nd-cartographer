name: release

# Push a tag like v0.1.0 to build the studio for Linux, Windows and macOS and
# attach the archives (with SHA-256 sums) to a GitHub release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create (for example v0.1.0-rc1; a hyphen makes it a pre-release)"
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            name: linux-x86_64
            ext: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows-x86_64
            ext: zip
          - os: macos-latest
            target: aarch64-apple-darwin
            name: macos-arm64
            ext: tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: Swatinem/rust-cache@v2
      - name: test
        run: cargo test --locked --release
      - name: build
        run: cargo build --release --locked --target ${{ matrix.target }} -p ndcart-server --bin ndcart
      - name: package
        shell: bash
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          dir="ndcart-${TAG}-${{ matrix.name }}"
          mkdir "$dir"
          bin=ndcart; [ "${{ matrix.ext }}" = zip ] && bin=ndcart.exe
          cp "target/${{ matrix.target }}/release/$bin" "$dir/"
          cp README.md LICENSE "$dir/"
          cp -r docs "$dir/docs"
          if [ "${{ matrix.ext }}" = zip ]; then 7z a "$dir.zip" "$dir" >/dev/null; else tar czf "$dir.tar.gz" "$dir"; fi
          if command -v sha256sum >/dev/null; then sha256sum "$dir.${{ matrix.ext }}" > "$dir.${{ matrix.ext }}.sha256"; else shasum -a 256 "$dir.${{ matrix.ext }}" > "$dir.${{ matrix.ext }}.sha256"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: ndcart-${{ matrix.name }}
          path: |
            ndcart-*.tar.gz
            ndcart-*.zip
            ndcart-*.sha256

  desktop:
    # The Tauri shell: the ndcart sidecar is built first, placed under the
    # target-triple name tauri expects, then the installers are bundled.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x86_64
            triple: x86_64-pc-windows-msvc
            sidecar_exe: ndcart.exe
          - os: ubuntu-latest
            name: linux-x86_64
            triple: x86_64-unknown-linux-gnu
            sidecar_exe: ndcart
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: webview dev packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - name: build the sidecar server
        run: cargo build --release --locked -p ndcart-server --bin ndcart
      - name: stage the sidecar under its target-triple name
        shell: bash
        run: |
          mkdir -p crates/ndcart-desktop/binaries
          cp "target/release/${{ matrix.sidecar_exe }}" \
             "crates/ndcart-desktop/binaries/ndcart-${{ matrix.triple }}${{ runner.os == 'Windows' && '.exe' || '' }}"
      - name: install tauri-cli
        run: cargo install tauri-cli --locked --version "^2"
      - name: bundle the installers
        run: cargo tauri build
      - name: package
        shell: bash
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          # Flat files in the workspace root (never a directory): the release
          # job uploads dist/* and `gh release create` refuses directories.
          prefix="ndcart-desktop-${TAG}-${{ matrix.name }}"
          if [ "${{ runner.os }}" = Windows ]; then
            cp target/release/bundle/nsis/*.exe "${prefix}-setup.exe" 2>/dev/null || true
            cp target/release/bundle/msi/*.msi "${prefix}.msi" 2>/dev/null || true
          else
            cp target/release/bundle/appimage/*.AppImage "${prefix}.AppImage" 2>/dev/null || true
            cp target/release/bundle/deb/*.deb "${prefix}.deb" 2>/dev/null || true
          fi
          ls "${prefix}"*
          [ -n "$(ls -A "${prefix}"* 2>/dev/null)" ] || { echo "no bundles produced"; exit 1; }
          if command -v sha256sum >/dev/null; then sha256sum "${prefix}"* > "${prefix}.sha256"; else shasum -a 256 "${prefix}"* > "${prefix}.sha256"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: ndcart-desktop-${{ matrix.name }}
          path: |
            ndcart-desktop-${{ github.event.inputs.tag || github.ref_name }}-${{ matrix.name }}*

  release:
    needs: [build, desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          pre=""; case "$TAG" in *-*) pre="--prerelease" ;; esac
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --title "$TAG" --target "$GITHUB_SHA" --generate-notes $pre
