name: docker

# Builds the image on every push, checks that it starts and answers its health
# check, and publishes it to ghcr.io when a release tag or main is pushed.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build
        run: docker build -t nd-cartographer:ci .
      - name: Start and check
        run: |
          mkdir -p "$RUNNER_TEMP/data" && sudo chown 568:568 "$RUNNER_TEMP/data"
          docker run -d --name t -p 8300:8300 -e ND_CARTO_TOKEN=ci-token -v "$RUNNER_TEMP/data:/data" --user 568:568 nd-cartographer:ci
          for i in $(seq 1 20); do
            docker exec t ndcart healthcheck && ok=1 && break
            sleep 1
          done
          docker logs t
          test "${ok:-}" = 1
          curl -fsS http://localhost:8300/health
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8300/api/docs)" = 401
          curl -fsS "http://localhost:8300/?token=ci-token" -o /dev/null
      - name: Log in
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish
        if: github.event_name != 'pull_request'
        run: |
          img=ghcr.io/${GITHUB_REPOSITORY,,}
          docker tag nd-cartographer:ci "$img:latest"
          docker push "$img:latest"
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            docker tag nd-cartographer:ci "$img:${GITHUB_REF_NAME}"
            docker push "$img:${GITHUB_REF_NAME}"
          fi
